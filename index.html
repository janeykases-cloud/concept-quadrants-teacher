<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>概念象限備課室</title><meta name="description" content="教師三同一異概念象限備課工具"><style>
:root{--navy:#11264b;--blue:#1852ad;--yellow:#ffd34e;--paper:#fff;--ink:#172033;--muted:#667085;--line:#ccd6e5;--bg:#edf3fb;--red:#b93838}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.mast{background:var(--navy);color:#fff;padding:18px max(18px,4vw);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;background:var(--yellow);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:10px}.logo i{background:var(--navy);border-radius:2px}.brand h1{font-size:1.25rem;line-height:1.1;margin:0}.brand small{display:block;color:#cad7ee;margin-top:4px}.status{border:1px solid #49668f;border-radius:999px;padding:6px 11px;font-size:.82rem}.desk{width:min(1420px,100%);margin:auto;padding:26px max(14px,3vw) 50px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px}.panel,.work{background:#fff;border:1px solid var(--line);box-shadow:0 15px 34px rgba(17,38,75,.1);border-radius:8px}.panel{padding:20px;align-self:start;position:sticky;top:14px}.panel h2{margin:0 0 5px;font-size:1.1rem}.intro{font-size:.86rem;color:var(--muted);margin:0 0 18px;padding-bottom:14px;border-bottom:1px dashed var(--line)}.field{margin-bottom:14px}.field label{display:flex;justify-content:space-between;font-size:.88rem;font-weight:800;margin-bottom:5px}.field label span{font-size:.75rem;color:var(--muted);font-weight:500}.field input,.field textarea,.field select{width:100%;border:1px solid #aebed5;border-radius:6px;padding:10px;background:#fbfdff;color:var(--ink);outline:none}.field textarea{min-height:68px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dce9ff}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.upload{border:1px dashed #90a5c4;padding:9px;border-radius:6px;display:flex;align-items:center}.upload input{display:none}.upload label{margin:0;color:var(--blue);cursor:pointer}.thumbs{display:flex;gap:4px;margin-left:auto}.thumbs img{width:30px;height:30px;object-fit:cover;border-radius:3px}.go{width:100%;border:0;border-radius:6px;background:var(--yellow);color:#19243c;padding:12px;font-weight:900;box-shadow:0 4px 0 #ac8000}.go:active{transform:translateY(2px);box-shadow:0 2px 0 #ac8000}.support{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}.support summary{color:var(--blue);font-size:.84rem;font-weight:800;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{background:#eef4ff;border:1px solid #becbe0;border-radius:999px;padding:3px 8px;font-size:.75rem}.work{overflow:hidden;min-height:720px}.head{padding:20px 22px;background:linear-gradient(90deg,#fff 62%,#e8f1ff);border-bottom:1px solid var(--line)}.eyebrow{color:var(--blue);font-size:.75rem;letter-spacing:.1em;font-weight:900}.head h2{font-size:clamp(1.4rem,2.7vw,2.15rem);line-height:1.2;margin:5px 0}.head p{font-size:.88rem;color:var(--muted);margin:0}.criteria{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.criterion{background:#fff;padding:14px 19px}.criterion b{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.08em;margin-bottom:3px}.criterion span{font-weight:800}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px}.tab{border:0;background:none;padding:12px 14px 10px;color:var(--muted);font-weight:800;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.setbar{padding:13px 18px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.setbtn,.tool{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 11px;font-weight:800;color:#536078}.setbtn.active{background:var(--navy);color:#fff}.tools{margin-left:auto;display:flex;gap:6px}.tool{font-size:.8rem;padding:6px 9px}.notice{display:none;margin:0 18px 16px;padding:13px;border-left:4px solid var(--red);background:#fff0f0;color:#762b2b}.notice.show{display:block}.sheet{margin:0 18px 20px;border:1px solid #9eaac0;box-shadow:4px 5px 0 #d8e0ed}.question{display:flex;gap:10px;align-items:center;background:#f5f8fd;border-bottom:1px solid var(--line);padding:12px 14px;font-weight:900}.qnum{background:var(--yellow);border-radius:4px;padding:3px 8px;font-size:.82rem}.questiontext{flex:1}.editable{outline:none}.editable:focus{background:#fffbe3;box-shadow:0 0 0 2px var(--yellow)}.grid{display:grid;grid-template-columns:1fr 1fr}.quad{min-height:195px;padding:14px;display:grid;grid-template-columns:32px 106px 1fr;gap:11px;align-items:center}.quad:nth-child(odd){border-right:1px solid var(--line)}.quad:nth-child(-n+2){border-bottom:1px solid var(--line)}.letter{align-self:start;width:31px;height:31px;background:var(--navy);color:#fff;display:grid;place-items:center;border-radius:4px;font-weight:900}.pic{aspect-ratio:1.2;background:#eaf2ff;border-radius:5px;display:grid;place-items:center;font-size:3.4rem;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.quad h3{font-size:1rem;line-height:1.3;margin:0 0 5px}.quad p{font-size:.86rem;color:var(--muted);margin:0}.answerbar{border-top:1px solid var(--line);padding:10px 13px;display:flex;align-items:center;gap:10px;background:#fafcff}.reveal{border:0;background:var(--navy);color:#fff;border-radius:4px;padding:7px 10px;font-weight:800}.answer{display:none;font-size:.86rem;color:#3f4d62}.answer.show{display:block}.valid{margin-left:auto;color:#14705a;background:#e5f5ef;border-radius:999px;padding:4px 8px;font-size:.75rem;font-weight:900;white-space:nowrap}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transform:translateY(8px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:980px){.desk{grid-template-columns:1fr}.panel{position:relative;top:0}.work{min-height:0}}@media(max-width:650px){.status{display:none}.desk{padding:12px 9px 35px}.panel{padding:16px}.criteria,.grid{grid-template-columns:1fr}.quad{border-right:0!important;border-bottom:1px solid var(--line)!important;grid-template-columns:31px 80px 1fr;min-height:145px;padding:11px}.quad:last-child{border-bottom:0!important}.pic{font-size:2.7rem}.sheet{margin:0 9px 14px}.notice{margin:0 9px 14px}.setbar{padding:11px}.tools{width:100%;margin-left:0}.valid{display:none}}@media print{.mast,.panel,.tabs,.setbar,.notice,.reveal{display:none!important}.desk{display:block;padding:0}.work{box-shadow:none;border:0}.sheet{box-shadow:none}.answer{display:block!important}}
</style></head><body><header class="mast"><div class="brand"><span class="logo"><i></i><i></i><i></i><i></i></span><div><h1>概念象限備課室</h1><small>把「三同一異」變成可以直接上課的題目</small></div></div><div class="status">離線題庫模式・不輸出假答案</div></header><div class="desk"><aside class="panel"><h2>設定這次要教的概念</h2><p class="intro">系統只為有完整內容的概念產生題目；不再用「情境一」這類文字假裝生成。</p><form id="form"><div class="field"><label for="concept">核心概念 <span>必填</span></label><input id="concept" list="concepts" value="家庭分工" required><datalist id="concepts"><option value="家庭分工"><option value="公平"><option value="偏見"><option value="性別平等"><option value="交易方式"><option value="溝通方式"></datalist></div><div class="field"><label for="topic">教學主題 <span>必填</span></label><input id="topic" value="主動分擔家庭工作" required></div><div class="field"><label for="question">想問學生的問題</label><textarea id="question">下列哪一種做法，沒有展現主動分擔？</textarea></div><div class="two"><div class="field"><label>年段</label><select><option>低年級</option><option selected>中年級</option><option>高年級</option></select></div><div class="field"><label>焦點</label><select><option>行為與做法</option><option>特徵與屬性</option><option>立場與觀點</option></select></div></div><div class="field"><label>參考圖片 <span>最多 4 張</span></label><div class="upload"><label for="images">＋ 選擇圖片</label><input id="images" type="file" accept="image/*" multiple><div class="thumbs" id="thumbs"></div></div></div><button class="go">產生 3 組完整題目</button></form><details class="support"><summary>目前可直接產生的概念</summary><div class="chips" id="chips"></div></details></aside><main class="work" id="work"><div class="head"><div class="eyebrow">CONCEPT QUADRANTS・教師版</div><h2 id="title">家庭分工｜主動分擔家庭工作</h2><p>每一格文字都可以直接點選修改，完成後可列印或存成 PDF。</p></div><div class="criteria"><div class="criterion"><b>三個例子的共通屬性</b><span id="common"></span></div><div class="criterion"><b>另一個例子的關鍵差異</b><span id="different"></span></div></div><div class="tabs"><button class="tab active" data-mode="text">一、文字組合</button><button class="tab" data-mode="visual">二、圖像＋簡單文字</button></div><div class="setbar" id="setbar"></div><div class="notice" id="notice"></div><section class="sheet" id="sheet"></section></main></div><div class="toast" id="toast"></div><script>
const lib={
'家庭分工':['看見共同需要，主動完成適合自己的家事','只處理自己的事情，沒有共同分擔',[[['整理客廳','主動收好共用空間的物品','🧺'],['收拾餐桌','用餐後一起整理桌面','🍽️'],['幫忙曬衣','看見衣服洗好，主動協助','👕'],['整理書包','只整理自己的物品','🎒']],[['補充用品','發現用品用完就主動補上','🧻'],['分類回收','一起整理家中的資源回收','♻️'],['照顧家人','陪伴需要休息的家人','🤝'],['等待提醒','一直催促才勉強動手','⏰']],[['共同討論','商量每個人能做的事','💬'],['輪流完成','依約定輪流做家事','🔄'],['互相協助','完成後也關心別人','🙌'],['固定代勞','總由同一人做完所有工作','🧍']]]],
'公平':['依需求與能力合理安排，讓每個人都有參與機會','表面完全相同，卻忽略不同需求或責任',[[['輪流發言','每位同學都有說話機會','🙋'],['依能力分工','安排每個人能完成的工作','🧩'],['需要者多協助','為需要幫助者提供支持','🤲'],['每人做一樣多','不管能力與需要都完全相同','📏']],[['共同訂規則','大家知道判斷標準','📋'],['依規則處理','相同情況使用相同標準','⚖️'],['提供補救機會','犯錯後能改正與學習','🌱'],['只聽朋友的','因關係好就給特別待遇','🤝']],[['工作可輪替','辛苦工作定期交換','🔄'],['說明安排理由','讓大家理解分配依據','💬'],['聽取不同需要','調整不合理的安排','👂'],['永遠指定同一人','總讓同一人做最辛苦工作','🧹']]]],
'偏見':['只看身分類別就下判斷，忽略每個人的差異','根據實際行為與證據了解個人',[[['性別刻板印象','認為玩具只能依性別選','🧸'],['族群刻板印象','把少數行為套到整個族群','👥'],['職業刻板印象','認為工作只適合特定性別','🧑‍🔧'],['個別理解','先了解個人的能力與選擇','🔎']],[['只看國籍','用國籍猜測一個人表現','🌏'],['只看年齡','認為同年紀能力都一樣','🎂'],['只看外表','依外觀判斷個性與能力','👀'],['查找證據','依實際行為與資料判斷','📋']],[['先入為主','還沒認識就先下結論','🚪'],['以偏概全','從單一例子推論所有人','🧩'],['貼上標籤','用稱呼取代完整理解','🏷️'],['保持開放','願依新證據修正看法','🌱']]]],
'性別平等':['不以性別限制興趣、能力、工作或表達','用性別決定一個人應該做什麼',[[['自由選玩具','每個人都能選喜歡的玩具','🧸'],['共同做家事','家事不限定某種性別','🧹'],['依能力選幹部','看能力意願，不看性別','🗳️'],['男生不能哭','以性別限制情緒表達','😢']],[['女生當隊長','依能力帶領團隊','🏅'],['男生學跳舞','自由發展自己的興趣','💃'],['共同照顧幼兒','照顧工作人人能參與','🍼'],['女生只能當護士','用性別限制職業選擇','🏥']],[['尊重穿著選擇','不嘲笑他人的服裝喜好','👕'],['平均發言機會','不同性別都有表達機會','🎤'],['運動項目自選','依興趣選擇活動','⚽'],['男生一定跑更快','以性別預測每人能力','🏃']]]],
'交易方式':['使用貨幣或支付工具交換商品與服務','沒有發生以金錢為媒介的交易',[[['現金','直接交付紙鈔或硬幣','💵'],['信用卡','使用信用額度之後付款','💳'],['行動支付','用手機連結帳戶付款','📱'],['以物易物','直接交換物品，不用貨幣','🔁']],[['網路下單','透過網路提出購買需求','🛒'],['商店購買','在實體店面選購商品','🏪'],['電話訂購','以電話確認商品與付款','☎️'],['自己製作','沒有向他人購買商品','🛠️']],[['禮券','用預付票券交換商品','🎫'],['電子票證','先儲值再感應扣款','🚇'],['轉帳','從帳戶移轉金額','🏦'],['借用物品','約定歸還，沒有買賣','🤲']]]],
'溝通方式':['具體說出事件、感受與期待，尊重對方回應','以指責、標籤或命令讓對方服從',[[['描述事件','我發現你拿了我的物品','👀'],['說出感受','我覺得不受尊重，很難過','💗'],['提出期待','下次請先問過我','🙏'],['貼上標籤','你就是一個自私的人','🏷️']],[['先聽完','讓對方把想法說完整','👂'],['確認理解','所以你需要幫忙嗎？','🔎'],['一起想辦法','我們可以怎麼調整？','🧩'],['提高音量','用吼叫讓對方停止說話','🔊']],[['使用我訊息','我擔心遲到，希望準時出發','💬'],['說明具體需要','請把音量調小一點','🎚️'],['接納不同意見','不同意但願意聽理由','🤝'],['翻舊帳','你上次也是這樣','🗂️']]] ]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data,mode='text',set=0,uploads=[],timer;function copy(o){return JSON.parse(JSON.stringify(o))}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function notify(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}function load(k){let x=copy(lib[k]);return{common:x[0],different:x[1],sets:x[2]}}function nav(){let tools='<div class="tools"><button class="tool" id="move">交換答案位置</button><button class="tool" id="print">列印／PDF</button></div>';$('#setbar').innerHTML=[0,1,2].map(i=>`<button class="setbtn ${i===set?'active':''}" data-i="${i}">第 ${i+1} 組</button>`).join('')+tools;$$('.setbtn').forEach(b=>b.onclick=()=>{set=+b.dataset.i;nav();render()});$('#print').onclick=()=>print();$('#move').onclick=()=>{data.sets[set].unshift(data.sets[set].pop());render();notify('答案位置已交換')}}function render(){let a=data.sets[set],q=$('#question').value.trim()||'以下哪一個不同？',L='ABCD';$('#sheet').innerHTML=`<div class="question"><span class="qnum">第 ${set+1} 組</span><span class="questiontext editable" contenteditable="true">${esc(q)}</span></div><div class="grid">${a.map((x,i)=>`<article class="quad"><span class="letter">${L[i]}</span><div class="pic">${uploads[i]&&mode==='visual'?`<img src="${uploads[i]}" alt="參考圖片">`:x[2]}</div><div><h3 class="editable" contenteditable="true">${esc(x[0])}</h3><p class="editable" contenteditable="true">${esc(mode==='visual'?x[1].slice(0,16):x[1])}</p></div></article>`).join('')}</div><div class="answerbar"><button class="reveal">顯示答案與理由</button><span class="answer"><strong>答案 ${L[a.length-1]}</strong>：${esc(data.different)}；另外三項共同點是「${esc(data.common)}」。</span><span class="valid">✓ 三同一異</span></div>`;$('.reveal').onclick=()=>$('.answer').classList.toggle('show')}function generate(){let c=$('#concept').value.trim(),t=$('#topic').value.trim(),k=Object.keys(lib).find(x=>c.includes(x)||x.includes(c));$('#notice').classList.remove('show');if(!k){$('#notice').innerHTML=`<strong>「${esc(c)}」尚未收錄。</strong> 為避免產生空泛或錯誤內容，本版不會用假文字充數。請選擇已支援概念；若要讓任意概念自動生成，需要啟用安全的 AI 連線。`;$('#notice').classList.add('show');$('#notice').scrollIntoView({block:'center'});return}data=load(k);set=0;$('#title').textContent=`${c}｜${t}`;$('#common').textContent=data.common;$('#different').textContent=data.different;nav();render();notify('已產生 3 組可編輯題目');setTimeout(()=>$('#work').scrollIntoView({block:'start'}),80)}$('#form').onsubmit=e=>{e.preventDefault();generate()};$$('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('#images').onchange=e=>{uploads=[];$('#thumbs').innerHTML='';[...e.target.files].slice(0,4).forEach(f=>{let r=new FileReader();r.onload=()=>{uploads.push(r.result);$('#thumbs').insertAdjacentHTML('beforeend',`<img src="${r.result}" alt="縮圖">`);if(mode==='visual')render()};r.readAsDataURL(f)})};$('#chips').innerHTML=Object.keys(lib).map(x=>`<span class="chip">${x}</span>`).join('');data=load('家庭分工');$('#common').textContent=data.common;$('#different').textContent=data.different;nav();render();
</script></body></html>
