<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="協助教師以三同一異設計文字與圖像概念象限。">
  <title>概念象限設計助手</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M9 9h21v21H9zm25 0h21v21H34zM9 34h21v21H9zm25 0h21v21H34z' fill='white'/%3E%3Ccircle cx='44.5' cy='44.5' r='7' fill='%23fbbf24'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d7deea;--paper:#fff;--blue:#165dff;--blue2:#0d3faa;--sky:#eaf2ff;--yellow:#ffd451;--mint:#dff6ee;--rose:#ffe7e5;--bg:#f4f7fb;--shadow:0 18px 45px rgba(23,32,51,.12)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55}
    button,input,textarea,select{font:inherit} button{cursor:pointer} .shell{min-height:100vh;display:grid;grid-template-columns:minmax(300px,390px) 1fr}
    aside{background:#10244a;color:#fff;padding:28px 26px;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:27px}.mark{width:42px;height:42px;border-radius:12px;background:var(--yellow);color:#10244a;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px;font-weight:900}.mark span{background:#10244a;border-radius:2px}.mark span:last-child{background:#fff}.brand h1{font-size:1.25rem;line-height:1.2;margin:0}.brand small{display:block;color:#b9c9eb;font-weight:500;margin-top:4px}
    .field{margin-bottom:17px}.field label{font-size:.9rem;font-weight:700;display:block;margin-bottom:7px;color:#eef4ff}.field input,.field textarea,.field select{width:100%;border:1px solid #486089;background:#182f5a;color:#fff;border-radius:10px;padding:11px 12px;outline:none}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8db4ff;box-shadow:0 0 0 3px rgba(141,180,255,.18)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{display:flex;gap:10px;align-items:center;background:#182f5a;border:1px dashed #6680ac;border-radius:10px;padding:10px}.upload input{display:none}.upload label{font-size:.88rem;margin:0;cursor:pointer;color:#fff}.thumbs{display:flex;gap:5px;margin-left:auto}.thumbs img{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid #fff}
    .generate{width:100%;border:0;border-radius:12px;background:var(--yellow);color:#172033;padding:13px 16px;font-weight:900;box-shadow:0 7px 0 #a97900;margin-top:6px}.generate:active{transform:translateY(4px);box-shadow:0 3px 0 #a97900}.rule{margin-top:23px;padding:15px;border:1px solid #385482;border-radius:12px;background:rgba(255,255,255,.04)}.rule button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:#fff;padding:0;font-weight:800}.rule p{color:#c8d5ee;font-size:.88rem;margin:10px 0 0}.rule[open] button .plus{transform:rotate(45deg)}
    main{padding:32px clamp(22px,4vw,58px) 60px;min-width:0}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.eyebrow{font-weight:800;color:var(--blue);letter-spacing:.08em;font-size:.82rem}.topline h2{font-size:clamp(1.65rem,3vw,2.55rem);line-height:1.15;margin:6px 0 8px}.topline p{margin:0;color:var(--muted);max-width:720px}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:#344054;font-weight:700}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px}.stat span{font-weight:800}
    .steps{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin-bottom:20px}.step{border:0;background:none;color:var(--muted);padding:13px 14px 12px;font-weight:800;position:relative}.step.active{color:var(--blue)}.step.active:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}.step .num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e8edf6;margin-right:6px}.step.active .num{background:var(--blue);color:#fff}
    .setnav{display:flex;gap:8px;margin-bottom:16px}.setbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;color:#596579}.setbtn.active{background:#172b54;color:#fff;border-color:#172b54}
    .workcard{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden}.questionbar{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff 60%,#eff5ff)}.qbadge{background:var(--yellow);border-radius:8px;padding:5px 10px;font-weight:900;white-space:nowrap}.question{font-size:1.15rem;font-weight:900;flex:1}.criterion{font-size:.82rem;color:var(--muted)}
    .quadrants{display:grid;grid-template-columns:1fr 1fr}.quad{min-height:220px;padding:18px;position:relative;border:0 solid var(--line);display:flex;gap:15px;align-items:center}.quad:nth-child(1),.quad:nth-child(2){border-bottom-width:1px}.quad:nth-child(1),.quad:nth-child(3){border-right-width:1px}.letter{position:absolute;top:13px;left:13px;width:34px;height:34px;border-radius:10px;background:#172b54;color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 #081735}.visual{width:42%;aspect-ratio:4/3;border-radius:13px;background:var(--sky);display:grid;place-items:center;font-size:clamp(3rem,7vw,5.5rem);overflow:hidden;flex:none}.visual img{width:100%;height:100%;object-fit:cover}.copy{padding-top:24px}.copy h3{margin:0 0 7px;font-size:1.15rem;line-height:1.35}.copy p{margin:0;color:var(--muted);font-size:.92rem}.odd{background:linear-gradient(135deg,#fff 70%,#fff4cf)}
    .teacherbar{display:flex;align-items:center;gap:12px;padding:15px 18px;background:#f8fafc;border-top:1px solid var(--line)}.answer{border:0;border-radius:9px;background:#172b54;color:#fff;padding:8px 12px;font-weight:800}.explain{color:#475467;font-size:.92rem;display:none}.explain.show{display:block}.quality{margin-left:auto;font-size:.82rem;color:#08735c;background:var(--mint);padding:5px 9px;border-radius:999px;white-space:nowrap}
    .note{margin-top:18px;background:#e9f1ff;border-left:5px solid var(--blue);padding:13px 16px;border-radius:0 12px 12px 0;color:#314264}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.shell{display:block}aside{position:relative;height:auto;min-height:0}.summary{grid-template-columns:1fr}.topline{display:block}.actions{margin-top:14px}.quadrants{grid-template-columns:1fr}.quad{border-right:0!important;border-bottom:1px solid var(--line)!important;min-height:190px}.quad:last-child{border-bottom:0!important}}
    @media(max-width:520px){main{padding:24px 14px 45px}.quad{align-items:flex-start}.visual{width:38%;margin-top:29px}.copy h3{font-size:1rem}.steps{overflow:auto}.criterion{display:none}.quality{display:none}}
    @media print{aside,.actions,.steps,.setnav,.answer,.note{display:none!important}.shell{display:block}.workcard{box-shadow:none}.explain{display:block!important}main{padding:0}.summary{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><h1>概念象限設計助手<small>給現場教師的三同一異出題工具</small></h1></div>
    <form id="generator">
      <div class="field"><label for="concept">核心概念</label><input id="concept" value="家庭分工" placeholder="例如：家庭分工、偏見、交易方式" required></div>
      <div class="field"><label for="topic">教學主題</label><input id="topic" value="主動分擔家庭工作" placeholder="例如：主動分擔家庭工作" required></div>
      <div class="field"><label for="question">引導提問</label><textarea id="question" placeholder="想讓學生辨認哪一個不同？">下列哪一種做法，沒有展現主動分擔？</textarea></div>
      <div class="row">
        <div class="field"><label for="grade">適用年段</label><select id="grade"><option>國小低年級</option><option selected>國小中年級</option><option>國小高年級</option><option>國中</option></select></div>
        <div class="field"><label for="focus">判斷焦點</label><select id="focus"><option>行為與做法</option><option>特徵與屬性</option><option>立場與觀點</option><option>功能與用途</option></select></div>
      </div>
      <div class="field"><label>參考圖片（選填）</label><div class="upload"><label for="images">＋ 加入課本或情境圖片</label><input id="images" type="file" accept="image/*" multiple><div class="thumbs" id="thumbs"></div></div></div>
      <button class="generate" type="submit">生成 3 組概念象限</button>
    </form>
    <details class="rule" open><summary style="list-style:none"><button type="button">生成規則：三同一異 <span class="plus">＋</span></button></summary><p>三個象限共享同一關鍵屬性；另一個象限只在該判準上不同。非例子仍須與主題有關，不能一眼就因外觀或類別完全無關而被排除。</p></details>
  </aside>
  <main>
    <div class="topline"><div><div class="eyebrow">CONCEPT QUADRANTS</div><h2 id="title">家庭分工｜主動分擔家庭工作</h2><p>先看文字組合，確認概念判準；再切換成圖像＋簡單文字，直接用於投影、學習單或課堂提問。</p></div><div class="actions"><button class="ghost" id="shuffle">重新排列答案</button><button class="ghost" onclick="window.print()">列印／存成 PDF</button></div></div>
    <div class="summary"><div class="stat"><b>共通屬性</b><span id="common">看見需要，主動完成適合自己的家事</span></div><div class="stat"><b>非例關鍵</b><span id="difference">只做自己的事，沒有共同分擔</span></div><div class="stat"><b>教師檢核</b><span>答案須能用一句判準清楚說明</span></div></div>
    <div class="steps" role="tablist"><button class="step active" data-mode="text"><span class="num">1</span>文字組合</button><button class="step" data-mode="visual"><span class="num">2</span>圖像＋簡單文字</button></div>
    <div class="setnav" id="setnav"></div>
    <section class="workcard" id="output" aria-live="polite"></section>
    <div class="note"><strong>教學使用：</strong>先請學生選出不同的象限，再追問「另外三個哪裡一樣？」最後請學生仿作一題，才能檢查是否真正掌握概念。</div>
  </main>
</div>
<script>
const banks={
  '家庭':{
    common:'看見需要，主動完成適合自己的家事',difference:'只做自己的事，沒有共同分擔',
    sets:[
      [['整理客廳','主動收好共用空間的物品','🧺'],['收拾餐桌','用餐後一起整理桌面','🍽️'],['幫忙曬衣','看見衣服洗好，主動協助','👕'],['整理書包','只整理自己的物品','🎒']],
      [['照顧家人','陪伴需要休息的家人','🤝'],['補充用品','發現衛生紙用完就補上','🧻'],['分類回收','一起整理家中的資源回收','♻️'],['等人提醒','有人一直說才勉強動手','⏰']],
      [['共同討論','先商量每個人能做的事','💬'],['輪流完成','依約定輪流做家事','🔄'],['互相協助','完成後也關心別人是否需要幫忙','🙌'],['固定代勞','總是由同一個人完成全部工作','🧍']]
    ]
  },
  '偏見':{
    common:'根據身分類別下判斷，忽略每個人的差異',difference:'以個別證據判斷，不用身分貼標籤',
    sets:[
      [['性別刻板印象','認為玩具只能依性別選擇','🧸'],['族群刻板印象','把少數人的行為套到整個族群','👥'],['職業刻板印象','認為某種工作只適合特定性別','🧑‍🔧'],['個別理解','先了解這個人的能力與選擇','🔎']],
      [['只看國籍','用國籍猜測一個人的表現','🌏'],['只看年齡','認為年紀相同能力就一樣','🎂'],['只看外表','依外觀判斷個性與能力','👀'],['查找證據','根據實際行為與資料判斷','📋']],
      [['先入為主','還沒認識就先下結論','🚪'],['以偏概全','從單一例子推論所有人','🧩'],['貼上標籤','用簡單稱呼取代完整理解','🏷️'],['保持開放','願意修正原本的看法','🌱']]
    ]
  },
  '交易':{
    common:'以預先儲值或信用額度完成非現金支付',difference:'直接用實體貨幣當場付款',
    sets:[
      [['信用卡','使用信用額度，之後付款','💳'],['電子票證','先儲值，再感應扣款','📱'],['禮券','以預付的票券交換商品','🎫'],['現金','直接交付紙鈔或硬幣','💵']],
      [['行動支付','以手機連結帳戶付款','📲'],['轉帳','從帳戶移轉金額','🏦'],['簽帳金融卡','由銀行帳戶直接扣款','💳'],['以物易物','直接交換物品，不使用貨幣','🔁']],
      [['網路下單','透過網路提出購買需求','🛒'],['超商取貨','到指定地點領取商品','📦'],['宅配到家','商品配送至住家','🚚'],['自己製作','沒有發生購買交易','🛠️']]
    ]
  },
  '溝通':{
    common:'使用指責或命令表達，容易讓對方防衛',difference:'說出具體事件、感受與期待',
    sets:[
      [['反覆責問','到底要我說幾遍？','📣'],['比較他人','為什麼別人可以我不行？','⚖️'],['強硬命令','我就是要這樣！','☝️'],['我訊息','我感到不受尊重，希望你先詢問我','💬']],
      [['貼標籤','你就是不負責任','🏷️'],['翻舊帳','你上次也是這樣','🗂️'],['讀心猜測','你根本不在乎我','🧠'],['具體請求','請先聽我說完，再告訴我你的想法','👂']],
      [['提高音量','用吼叫讓對方服從','🔊'],['威脅後果','不照做就別想出去','⛔'],['否定感受','這有什麼好難過的','🙅'],['同理回應','我聽見你很難過，願意再說說嗎？','🤲']]
    ]
  }
};
let mode='text',setIndex=0,uploads=[],current=null,oddIndex=3;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function pickBank(concept,topic){const s=concept+topic;const key=Object.keys(banks).find(k=>s.includes(k));if(key)return structuredClone(banks[key]);return genericBank(concept,topic)}
function genericBank(concept,topic){return {common:`能呈現「${concept}」在「${topic}」中的關鍵特徵`,difference:`與主題相關，但不符合「${concept}」的核心判準`,sets:[
  [[`符合概念的情境一`,`清楚呈現「${concept}」的第一個例子`,'✅'],[`符合概念的情境二`,`從另一種生活情境呈現同一特徵`,'🔍'],[`符合概念的情境三`,`仍符合相同判準，但表面線索不同`,'🧩'],[`相近的非例子`,`和「${topic}」有關，卻缺少關鍵特徵`,'↔️']],
  [[`正例：日常做法`,`在生活中實踐「${concept}」`,'🏠'],[`正例：校園做法`,`在學校情境實踐相同概念`,'🏫'],[`正例：公共做法`,`在公共生活中呈現相同概念`,'🌐'],[`非例：只有表面相似`,`看似相關，實際判準不同`,'🪞']],
  [[`有意識的選擇`,`能說明行動與「${concept}」的關係`,'💡'],[`持續的行動`,`不只一次，而是能穩定實踐`,'🛤️'],[`考量他人與情境`,`能依情況做合適調整`,'🤝'],[`只背誦定義`,`說得出詞語，卻未展現在判斷或行動中`,'📖']]
]}}
function shuffledSet(items){const base=items.map(x=>[...x]);const odd=base.pop();const at=oddIndex%4;base.splice(at,0,odd);return {items:base,answer:at}}
function render(){
  const raw=current.sets[setIndex];const {items,answer}=shuffledSet(raw);const letters=['A','B','C','D'];const q=$('#question').value.trim()||`以下哪一個不符合「${$('#concept').value}」？`;
  $('#output').innerHTML=`<div class="questionbar"><span class="qbadge">第 ${setIndex+1} 組</span><div class="question">${escapeHtml(q)}</div><div class="criterion">判準先藏起來，讓學生推論</div></div><div class="quadrants">${items.map((x,i)=>`<article class="quad ${i===answer?'odd':''}"><span class="letter">${letters[i]}</span><div class="visual">${uploads[i]&&mode==='visual'?`<img src="${uploads[i]}" alt="使用者提供的參考圖片">`:x[2]}</div><div class="copy"><h3>${escapeHtml(x[0])}</h3><p>${mode==='text'?escapeHtml(x[1]):escapeHtml(shorten(x[1]))}</p></div></article>`).join('')}</div><div class="teacherbar"><button class="answer" type="button">顯示答案與判準</button><span class="explain"><strong>答案 ${letters[answer]}</strong>：${escapeHtml(current.difference)}；另外三項共同點是「${escapeHtml(current.common)}」。</span><span class="quality">✓ 三同一異</span></div>`;
  $('.answer').onclick=()=>$('.explain').classList.toggle('show');
}
function renderNav(){
 $('#setnav').innerHTML=[0,1,2].map(i=>`<button class="setbtn ${i===setIndex?'active':''}" data-i="${i}">第 ${i+1} 組</button>`).join('');
 $$('.setbtn').forEach(b=>b.onclick=()=>{setIndex=+b.dataset.i;renderNav();render()})
}
function generate(){const c=$('#concept').value.trim(),t=$('#topic').value.trim();current=pickBank(c,t);setIndex=0;$('#title').textContent=`${c}｜${t}`;$('#common').textContent=current.common;$('#difference').textContent=current.difference;renderNav();render()}
function shorten(s){return s.replace(/，.*/,'').slice(0,18)} function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#generator').addEventListener('submit',e=>{e.preventDefault();generate();window.scrollTo({top:0,behavior:'smooth'})});
$$('.step').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.step').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#shuffle').onclick=()=>{oddIndex=(oddIndex+1)%4;render()};
$('#images').onchange=e=>{uploads=[];$('#thumbs').innerHTML='';[...e.target.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{uploads.push(r.result);$('#thumbs').insertAdjacentHTML('beforeend',`<img src="${r.result}" alt="已上傳圖片縮圖">`);if(mode==='visual')render()};r.readAsDataURL(f)})};
generate();
</script>
</body>
</html>
